<main><aside><div class="eyebrow">LUNAR POWER · PUZZLE</div><h1>以月光之名，<br>送回水晶。</h1><p class="intro">月之公主踏上星夜迷宮。<br>推動魔法水晶，讓它們回到月光座標。</p><nav class="levels" aria-label="選擇關卡"></nav><button class="random-button" id="random">✦ 開啟新的星際任務</button><div class="rules"><b>任務守則</b><br>① 將所有魔法水晶送回星光座標。<br>② 一次只能推動一顆水晶，不能拉回。<br>③ 卡住了？復原一步，再次變身出發。<br><br><b>鍵盤</b>　方向鍵 / WASD<br><b>快捷鍵</b>　Z 復原 · R 重來<br><b>手機</b>　下方方向按鈕 / 棋盤滑動</div></aside>
<section class="play-area"><div class="topline"><h2 id="level-title"></h2><div class="stats"><div class="stat">步數<b id="moves">0</b></div><div class="stat">水晶歸位<b id="goals">0 / 1</b></div></div></div><div class="board-wrap"><canvas id="board" width="720" height="720" role="img" aria-label="月光水晶推箱子棋盤：使用方向鍵或下方按鈕操作"></canvas><div class="win" id="win" hidden><div><div class="flower">🌙</div><div class="eyebrow">MISSION COMPLETE</div><h3 id="win-title">月光任務完成！</h3><p id="win-copy"></p><button id="next">下一個星際任務 →</button><br><button class="secondary" id="replay">再次挑戰</button></div></div></div><div class="legend"><span><i></i>魔法水晶</span><span><i class="goal"></i>星光座標</span><span>☾ 月之公主</span></div><div class="message" id="message" role="status" aria-live="polite"></div><div class="toolbar"><button id="undo">↶ 復原一步</button><button id="restart">↻ 重新開始</button><button id="hint">✧ 任務提示</button></div><div class="dpad" aria-label="移動方向"><button data-dir="U" aria-label="向上">↑</button><button data-dir="L" aria-label="向左">←</button><button data-dir="D" aria-label="向下">↓</button><button data-dir="R" aria-label="向右">→</button></div><div class="footer">星光會指引你，慢慢推進任務。<span id="best"></span></div></section></main>
<script id="model">
const LEVELS=[
{name:'第一箱的旅行',sub:'01 · 暖身練習',hint:'走到木箱左邊，向右推到金色圓圈。',map:['#######','#     #','#     #','# @$ .#','#     #','#     #','#######']},
{name:'兩箱的默契',sub:'02 · 換個方向',hint:'兩個目的地都在上方。試著從木箱下方往上推。',map:['#######','# . . #','#     #','# $ $ #','#  @  #','#     #','#######']},
{name:'花園小迷宮',sub:'03 · 想好再推',hint:'先把右邊的箱子往上送，再繞到左箱下方。小心別把箱子推進角落。',map:['########','#  . . #','#  #   #','# $  $ #','#   #  #','#  @   #','#      #','########']}
];
const DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function createState(level){const walls=[],goals=[],boxes=[];let player;level.map.forEach((row,y)=>[...row].forEach((c,x)=>{const p=y*row.length+x;if(c==='#')walls.push(p);if('.+*'.includes(c))goals.push(p);if('$*'.includes(c))boxes.push(p);if('@+'.includes(c))player=p}));return {width:level.map[0].length,height:level.map.length,walls,goals,boxes,player,moves:0};}
function won(s){return s.boxes.every(p=>s.goals.includes(p));}
function advance(s,dir){if(won(s))return null;const [dx,dy]=DIR[dir],x=s.player%s.width,y=Math.floor(s.player/s.width),nx=x+dx,ny=y+dy;if(nx<0||nx>=s.width||ny<0||ny>=s.height)return null;const n=ny*s.width+nx;if(s.walls.includes(n))return null;const boxes=[...s.boxes];if(boxes.includes(n)){const bx=nx+dx,by=ny+dy,b=by*s.width+bx;if(bx<0||bx>=s.width||by<0||by>=s.height||s.walls.includes(b)||boxes.includes(b))return null;boxes[boxes.indexOf(n)]=b;}return {...s,player:n,boxes,moves:s.moves+1};}

// Start solved and pull boxes backwards. Reversing the recorded moves is a legal solution.
function generateLevel(seed){
 seed=seed>>>0;let rng=seed;
 const random=()=>{rng+=0x6D2B79F5;let t=rng;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};
 const pick=a=>a[Math.floor(random()*a.length)], opposite={U:'D',D:'U',L:'R',R:'L'};
 for(let attempt=0;attempt<80;attempt++){
  const width=8,walls=new Set(),floor=[];
  for(let p=0;p<64;p++){const x=p%8,y=Math.floor(p/8);if(!x||x===7||!y||y===7)walls.add(p);else floor.push(p)}
  // Interior obstacles vary the routes; reject disconnected layouts.
  for(let n=0;n<4;n++)walls.add(pick(floor));
  const free=floor.filter(p=>!walls.has(p)),seen=new Set([free[0]]),queue=[free[0]];
  for(const p of queue)for(const d of [-8,8,-1,1])if(!walls.has(p+d)&&!seen.has(p+d)){seen.add(p+d);queue.push(p+d)}
  if(seen.size!==free.length)continue;
  const candidates=free.filter(p=>p%8>1&&p%8<6&&p>15&&p<48);
  if(candidates.length<3)continue;
  const goals=[];while(goals.length<3){const p=pick(candidates);if(!goals.includes(p))goals.push(p)}
  const boxes=[...goals];let player=pick(free.filter(p=>!boxes.includes(p))),pulls=0;const trace=[];
  for(let step=0;step<1200;step++){
   const moves=Object.keys(DIR).filter(d=>{const [x,y]=DIR[d],n=player+x+y*width;return !walls.has(n)&&!boxes.includes(n)});
   if(!moves.length)break;
   const pulling=moves.filter(d=>{const [x,y]=DIR[d];return boxes.includes(player-x-y*width)});
   const d=pick(pulling.length&&random()<0.8?pulling:moves),[dx,dy]=DIR[d],delta=dx+dy*width,b=boxes.indexOf(player-delta);
   if(b>=0){boxes[b]=player;pulls++}player+=delta;trace.push(opposite[d]);
  }
  if(pulls<12||boxes.some(p=>goals.includes(p)))continue;
  const map=Array.from({length:8},(_,y)=>Array.from({length:8},(_,x)=>{const p=y*8+x;return walls.has(p)?'#':p===player?(goals.includes(p)?'+':'@'):boxes.includes(p)?(goals.includes(p)?'*':'$'):goals.includes(p)?'.':' '}).join(''));
  return {name:'隨機小花園',sub:'隨機 · 三箱挑戰',hint:`關卡編號 ${seed} · 三個木箱都有路可到達目的地，先觀察再推。`,seed,map,solution:trace.reverse()};
 }
 // Bounded fallback: three boxes each one push below their goals, always solvable.
 return {name:'隨機小花園',sub:'隨機 · 三箱挑戰',seed,hint:`關卡編號 ${seed} · 從箱子下方往上推。`,map:['########','# . . .#','# $ $ $#','# @    #','#      #','#      #','#      #','########'],solution:['U','D','R','R','U','D','R','R','U']};
}
</script>
<script>function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function star(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();}
function draw(){
 const W=720,H=720;ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#20143e');bg.addColorStop(.55,'#392354');bg.addColorStop(1,'#171c46');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(let i=0;i<42;i++){const x=(i*137+29)%W,y=(i*83+17)%H;ctx.globalAlpha=.35+(i%4)*.12;star(x,y,i%3?3:5,i%2?'#fff2bd':'#ffc9ed')}ctx.globalAlpha=1;
 const t=Math.min(680/state.width,680/state.height),ox=(W-state.width*t)/2,oy=(H-state.height*t)/2;
 for(let y=0;y<state.height;y++)for(let x=0;x<state.width;x++){const p=y*state.width+x,X=ox+x*t,Y=oy+y*t;
  if(state.walls.includes(p)){rounded(X+3,Y+8,t-6,t-10,12,'#7f4e9d');rounded(X+3,Y+2,t-6,t-12,12,'#b47cc5');rounded(X+9,Y+6,t-18,4,3,'#f4c5ef');ctx.strokeStyle='#e9aee4';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X+t/2,Y+t*.48,t*.27,Math.PI,Math.PI*2);ctx.stroke();}
  else{rounded(X+2,Y+2,t-4,t-4,9,(x+y)%2?'#f7eafb':'#fff4f8');ctx.strokeStyle='#f1c5df';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X+8,Y+t-9);ctx.lineTo(X+t-8,Y+9);ctx.stroke();if(state.goals.includes(p)){ctx.save();ctx.translate(X+t/2,Y+t/2);ctx.rotate(Math.PI/4);ctx.fillStyle='#ffe48d';ctx.shadowColor='#ffb9f1';ctx.shadowBlur=18;ctx.fillRect(-t*.19,-t*.19,t*.38,t*.38);ctx.restore();star(X+t/2,Y+t/2,t*.17,'#fff9cf');}}
 }
 state.boxes.forEach(p=>{const x=ox+p%state.width*t,y=oy+Math.floor(p/state.width)*t,g=state.goals.includes(p);ctx.save();ctx.shadowColor=g?'#ffe987':'#f69ce1';ctx.shadowBlur=14;rounded(x+10,y+15,t-20,t-20,13,g?'#e98fc8':'#9f75cf');ctx.restore();rounded(x+10,y+8,t-20,t-20,12,g?'#ffe5a0':'#eec3f2');ctx.strokeStyle=g?'#c762a6':'#9864bb';ctx.lineWidth=4;ctx.strokeRect(x+17,y+15,t-34,t-34);star(x+t/2,y+t/2,t*.2,g?'#ef84bd':'#a96ac9');if(g){ctx.fillStyle='#fff9df';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('✦',x+t/2,y+t/2+6)}});
 const px=ox+state.player%state.width*t+t/2,py=oy+Math.floor(state.player/state.width)*t+t/2;
 ctx.fillStyle='#120d2b55';ctx.beginPath();ctx.ellipse(px,py+t*.34,t*.28,t*.1,0,0,Math.PI*2);ctx.fill();
 // Moon princess silhouette: twin golden hair buns, long pigtails, sailor collar and red bow.
 ctx.strokeStyle='#f7c85d';ctx.lineWidth=t*.12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px-t*.17,py-t*.1);ctx.quadraticCurveTo(px-t*.38,py+t*.15,px-t*.29,py+t*.34);ctx.moveTo(px+t*.17,py-t*.1);ctx.quadraticCurveTo(px+t*.38,py+t*.15,px+t*.29,py+t*.34);ctx.stroke();
 ctx.fillStyle='#f4c955';for(const d of [-1,1]){ctx.beginPath();ctx.arc(px+d*t*.23,py-t*.27,t*.105,0,Math.PI*2);ctx.fill();}
 rounded(px-t*.22,py-t*.02,t*.44,t*.32,10,'#f8f4ff');ctx.fillStyle='#d93b86';ctx.beginPath();ctx.moveTo(px,py+t*.04);ctx.lineTo(px-t*.18,py-t*.03);ctx.lineTo(px-t*.14,py+t*.12);ctx.lineTo(px,py+t*.08);ctx.lineTo(px+t*.14,py+t*.12);ctx.lineTo(px+t*.18,py-t*.03);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f6d4c8';ctx.beginPath();ctx.ellipse(px,py-t*.19,t*.21,t*.25,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#55315f';for(const d of [-1,1]){ctx.beginPath();ctx.ellipse(px+d*t*.08,py-t*.18,t*.025,t*.06,0,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#f7c84e';ctx.beginPath();ctx.moveTo(px-t*.2,py-t*.31);ctx.lineTo(px-t*.17,py-t*.48);ctx.lineTo(px-t*.06,py-t*.36);ctx.lineTo(px+t*.05,py-t*.49);ctx.lineTo(px+t*.15,py-t*.35);ctx.lineTo(px+t*.22,py-t*.28);ctx.lineTo(px+t*.13,py-t*.32);ctx.lineTo(px,py-t*.3);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff19d';ctx.beginPath();ctx.arc(px,py-t*.43,t*.075,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d89a42';ctx.lineWidth=2;ctx.stroke();
}


let current=0,state,history=[],records={};try{records=JSON.parse(localStorage.getItem('box-garden-v1')||'{}')||{}}catch{}
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
function recordKey(i=current){return LEVELS[i].seed===undefined?i:'random-'+LEVELS[i].seed;}
const seenMaps=new Set();let challengeNumber=0;
function randomLevel(){
 const a=new Uint32Array(1);
 for(let attempt=0;attempt<100;attempt++){
  crypto.getRandomValues(a);const level=generateLevel(a[0]),fingerprint=level.map.join('\n');
  if(seenMaps.has(fingerprint))continue;
  seenMaps.add(fingerprint);challengeNumber++;
  level.name=`第 ${challengeNumber} 關 · 小花園`;level.sub='挑戰 · 每關不同';
  LEVELS[3]=level;load(3);return;
 }
 $('message').textContent='暫時未產生新的布局，請再按一次換關。';
}
function nav(){document.querySelector('.levels').innerHTML=[3,0,1,2].filter(i=>LEVELS[i]).map(i=>{const l=LEVELS[i];return `<button class="level ${current===i?'active':''}" data-level="${i}" aria-current="${current===i?'step':'false'}"><span class="num">${i===3?'∞':i+1}</span><span><strong>${i===3?'隨機闖關':'練習 '+(i+1)}</strong><small>${i===3?'第 '+challengeNumber+' 關':l.name}</small></span><span class="badge">${records[recordKey(i)]?'✓':'↗'}</span></button>`}).join('');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>load(+b.dataset.level));}
function render(){draw();$('moves').textContent=state.moves;$('goals').textContent=state.boxes.filter(p=>state.goals.includes(p)).length+' / '+state.goals.length;$('undo').disabled=!history.length;$('level-title').textContent=LEVELS[current].name;$('best').textContent=records[recordKey()]?' 最佳：'+records[recordKey()]+' 步':'';$('win').hidden=!won(state);nav();}
function load(i){current=i;state=createState(LEVELS[i]);history=[];$('message').textContent=LEVELS[i].hint;render();}
function move(d){const next=advance(state,d);if(!next){if(!won(state))$('message').textContent='這邊推不動，試試另一個方向。';return;}history.push(state);state=next;$('message').textContent='把每個木箱，送回它的位置。';const trapped=state.boxes.some(p=>!state.goals.includes(p)&&(state.walls.includes(p-1)||state.walls.includes(p+1))&&(state.walls.includes(p-state.width)||state.walls.includes(p+state.width)));if(trapped)$('message').textContent='木箱卡進角落了！按「復原一步」就能救回來。';if(won(state)){records[recordKey()]=Math.min(records[recordKey()]||Infinity,state.moves);try{localStorage.setItem('box-garden-v1',JSON.stringify(records))}catch{}$('win-title').textContent=current===2?'花園整理完成！':'每一箱，都剛剛好。';$('win-copy').textContent=`用了 ${state.moves} 步，完成 ${state.goals.length} 個木箱歸位。`;$('next').textContent='下一關 · 全新地圖 →';$('message').textContent='過關！也可以復原一步，繼續研究更短的路線。';}render();}
function undo(){if(history.length){state=history.pop();$('message').textContent='回到上一步，換個想法再試。';render();}}
$('undo').onclick=undo;$('restart').onclick=()=>load(current);$('replay').onclick=()=>load(current);$('random').onclick=randomLevel;$('next').onclick=randomLevel;$('hint').onclick=()=>{$('message').textContent=LEVELS[current].hint};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const d={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key]||{w:'U',s:'D',a:'L',d:'R'}[e.key.toLowerCase()];if(d){e.preventDefault();move(d)}else if(e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if(e.key.toLowerCase()==='r'){e.preventDefault();load(current)}});
let touchStart=null;canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touchStart||touchStart.id!==e.pointerId)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'R':'L':dy>0?'D':'U')});canvas.addEventListener('pointercancel',()=>touchStart=null);
randomLevel();
if(new URLSearchParams(location.search).has('qa'))window.gameQA={read:()=>JSON.parse(JSON.stringify(state)),load,move,undo,levels:LEVELS,generateLevel,randomLevel};
</script></body></html>
